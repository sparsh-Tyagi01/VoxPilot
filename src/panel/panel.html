<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>VoxPilot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      width: 340px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo { font-size: 20px; }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .header-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-dot.listening { background: var(--success); animation: pulse 1.4s infinite; }
    .status-dot.error     { background: var(--danger); }
    .status-dot.thinking  { background: var(--warn); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ─── Toggle Button ─── */
    .toggle-btn {
      width: calc(100% - 32px);
      margin: 14px 16px 10px;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .toggle-btn:hover { background: var(--accent-hover); }
    .toggle-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .toggle-btn.active { background: var(--danger); }
    .toggle-btn kbd { font-size: 11px; opacity: 0.75; background: rgba(255,255,255,0.15); border-radius: 4px; padding: 1px 5px; }

    /* ─── Transcript ─── */
    .section { padding: 0 16px; margin-bottom: 14px; }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .transcript-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-height: 48px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    .transcript-box.empty { color: var(--muted); font-style: italic; }

    /* ─── Plan Preview ─── */
    .plan-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .plan-intent {
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .risk-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .risk-0, .risk-1 { background: rgba(16,185,129,0.15); color: var(--success); }
    .risk-2          { background: rgba(99,102,241,0.15); color: #818cf8; }
    .risk-3          { background: rgba(245,158,11,0.15); color: var(--warn); }
    .risk-4          { background: rgba(239,68,68,0.15);  color: var(--danger); }

    .plan-actions {
      list-style: none;
      padding: 6px 12px;
    }

    .plan-action {
      font-size: 12px;
      color: var(--muted);
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .plan-action.done  { color: var(--success); }
    .plan-action.active { color: var(--text); }

    /* ─── Confirmation Buttons ─── */
    .confirm-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .btn-cancel  { background: transparent; border-color: var(--border); color: var(--muted); }
    .btn-cancel:hover { background: var(--surface); }
    .btn-confirm { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-confirm:hover { background: var(--accent-hover); }

    /* ─── History ─── */
    .history-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
    }

    .history-item-text { flex: 1; color: var(--muted); }
    .history-item-text strong { color: var(--text); display: block; }

    .btn-undo {
      font-size: 11px;
      padding: 2px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-undo:hover { background: var(--surface); color: var(--text); }

    /* ─── Empty States ─── */
    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px 0;
    }

    /* ─── Footer ─── */
    .footer {
      margin-top: auto;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-link {
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      padding: 3px;
      border-radius: 4px;
    }

    .footer-link:hover { color: var(--text); }
    .footer-link:focus-visible { outline: 2px solid var(--accent); }

    /* ─── Hidden state ─── */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <span class="logo" aria-hidden="true">🎙️</span>
    <span class="header-title">VoxPilot</span>
    <div class="header-status" role="status" aria-live="polite" aria-label="Agent status">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span id="status-text">Idle</span>
    </div>
  </header>

  <!-- Main Toggle -->
  <button class="toggle-btn" id="toggle-btn" type="button" aria-pressed="false">
    <span id="toggle-icon" aria-hidden="true">🎙️</span>
    <span id="toggle-label">Start Listening</span>
    <kbd aria-label="keyboard shortcut">Alt+V</kbd>
  </button>

  <!-- Live Transcript -->
  <section class="section" aria-label="Live transcript">
    <div class="section-label">Transcript</div>
    <div class="transcript-box empty" id="transcript-box" aria-live="polite" aria-label="Speech transcript">
      Waiting for voice input…
    </div>
  </section>

  <!-- Plan Preview (hidden until plan is ready) -->
  <section class="section" id="plan-section" aria-label="Current plan" hidden>
    <div class="section-label">Plan</div>
    <div class="plan-box">
      <div class="plan-intent">
        <span id="plan-intent-text">—</span>
        <span class="risk-pill risk-0" id="risk-pill">R0</span>
      </div>
      <ul class="plan-actions" id="plan-actions" aria-label="Planned actions"></ul>

      <!-- Confirmation buttons — shown for R3/R4 -->
      <div class="confirm-buttons" id="confirm-buttons" hidden>
        <button class="btn btn-cancel" id="btn-cancel" type="button">Cancel <kbd>Esc</kbd></button>
        <button class="btn btn-confirm" id="btn-confirm" type="button">Confirm <kbd>Enter</kbd></button>
      </div>
    </div>
  </section>

  <!-- History -->
  <section class="section" aria-label="Recent commands">
    <div class="section-label">Recent</div>
    <div class="history-list" id="history-list" role="log" aria-live="polite">
      <div class="empty-state" id="history-empty">No commands yet.</div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <button class="footer-link" id="btn-settings" type="button" aria-label="Open settings">Settings</button>
    <button class="footer-link" id="btn-privacy" type="button" aria-label="Privacy info">🔒 On-device</button>
    <button class="footer-link" id="btn-help" type="button" aria-label="Help and commands">Help</button>
  </footer>

  <script src="./panel.ts" type="module"></script>
</body>
</html>
